default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST") { "localhost" } %>
  port: <%= ENV.fetch("DATABASE_PORT") { 5433 } %>
  username: <%= ENV.fetch("DATABASE_USER") { "loop" } %>
  password: <%= ENV.fetch("DATABASE_PASSWORD") { "loop_dev_password" } %>

development:
  <<: *default
  database: loop_development

test:
  <<: *default
  database: loop_test

production:
  <<: *default
  database: loop_production
  username: <%= ENV["DATABASE_USER"] %>
  password: <%= ENV["DATABASE_PASSWORD"] %>